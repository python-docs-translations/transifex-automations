version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    assignees:
      - "rffontenelle"
    commit-message:
      prefix: "gha"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
    assignees:
      - "rffontenelle"
    commit-message:
      prefix: "pip"
    groups:
      pip:
        patterns:
          - "*"
